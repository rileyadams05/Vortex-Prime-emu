name = "vortex-prime-store-api"
main = "worker.js"
compatibility_date = "2026-05-25"
# These route declarations document the existing production attachment.
# CI uploads and promotes versions without applying trigger changes, so the
# API token does not need permission to edit Cloudflare zone routes.
workers_dev = false

routes = [
  { pattern = "vortex-prime-emu.com/api", zone_name = "vortex-prime-emu.com" },
  { pattern = "vortex-prime-emu.com/api/*", zone_name = "vortex-prime-emu.com" },
  { pattern = "vortex-prime-emu.com/privacy-policy", zone_name = "vortex-prime-emu.com" }
]

[[durable_objects.bindings]]
name = "NXE_PAIR_SESSIONS"
class_name = "NxePairSession"

[[migrations]]
tag = "nxe-pair-v1"
new_sqlite_classes = ["NxePairSession"]
