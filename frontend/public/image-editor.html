<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Vortex Prime Logo Creator</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            background: #1a1a1a;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
        }
        
        h1 {
            color: #00d9ff;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 20px;
            max-width: 1200px;
        }
        
        canvas {
            border: 2px solid #00d9ff;
            max-width: 100%;
            height: auto;
        }
        
        .controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
        }
        
        .control-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        label {
            font-weight: bold;
            color: #00d9ff;
        }
        
        input[type="file"] {
            padding: 10px;
            background: #3a3a3a;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
        }
        
        input[type="text"],
        input[type="number"],
        input[type="color"] {
            padding: 10px;
            background: #3a3a3a;
            border: 1px solid #555;
            border-radius: 4px;
            color: #fff;
            font-size: 16px;
        }
        
        button {
            padding: 12px 24px;
            background: #00d9ff;
            color: #000;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        
        button:hover {
            background: #00b8d4;
        }
        
        button:disabled {
            background: #555;
            cursor: not-allowed;
        }
        
        .instructions {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #00d9ff;
            max-width: 600px;
        }
        
        .instructions ol {
            margin: 10px 0;
            padding-left: 20px;
        }
        
        .instructions li {
            margin: 8px 0;
        }
    </style>
</head>
<body>
    <h1>Vortex Prime Logo Creator</h1>
    
    <div class="instructions">
        <h3>Instructions:</h3>
        <ol>
            <li>Upload the original BUDM4N image</li>
            <li>Adjust the text position and styling if needed</li>
            <li>Click "Download Modified Image"</li>
            <li>Save the image as "vortex-prime-bg.jpg" in the assets/wallpapers folder</li>
        </ol>
    </div>
    
    <div class="container">
        <div class="controls">
            <div class="control-group">
                <label for="imageUpload">Upload Original Image:</label>
                <input type="file" id="imageUpload" accept="image/*">
            </div>
            
            <div class="control-group">
                <label for="newText">New Text:</label>
                <input type="text" id="newText" value="VORTEX PRIME">
            </div>
            
            <div class="control-group">
                <label for="fontSize">Font Size:</label>
                <input type="number" id="fontSize" value="120" min="20" max="300">
            </div>
            
            <div class="control-group">
                <label for="textY">Vertical Position (Y):</label>
                <input type="number" id="textY" value="450" min="0" max="1000">
            </div>
            
            <div class="control-group">
                <label for="textColor">Text Color:</label>
                <input type="color" id="textColor" value="#ffffff">
            </div>
            
            <div class="control-group">
                <label for="strokeColor">Outline Color:</label>
                <input type="color" id="strokeColor" value="#00d9ff">
            </div>
            
            <div class="control-group">
                <label for="strokeWidth">Outline Width:</label>
                <input type="number" id="strokeWidth" value="8" min="0" max="20">
            </div>
            
            <button id="updateBtn" disabled>Update Preview</button>
            <button id="downloadBtn" disabled>Download Modified Image</button>
        </div>
        
        <canvas id="canvas"></canvas>
    </div>

    <script>
        const canvas = document.getElementById('canvas');
        const ctx = canvas.getContext('2d');
        const imageUpload = document.getElementById('imageUpload');
        const newText = document.getElementById('newText');
        const fontSize = document.getElementById('fontSize');
        const textY = document.getElementById('textY');
        const textColor = document.getElementById('textColor');
        const strokeColor = document.getElementById('strokeColor');
        const strokeWidth = document.getElementById('strokeWidth');
        const updateBtn = document.getElementById('updateBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        
        let originalImage = null;
        
        imageUpload.addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(event) {
                    const img = new Image();
                    img.onload = function() {
                        originalImage = img;
                        canvas.width = img.width;
                        canvas.height = img.height;
                        updateBtn.disabled = false;
                        downloadBtn.disabled = false;
                        drawImage();
                    };
                    img.src = event.target.result;
                };
                reader.readAsDataURL(file);
            }
        });
        
        function drawImage() {
            if (!originalImage) return;
            
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.drawImage(originalImage, 0, 0);
            
            const text = newText.value;
            const size = parseInt(fontSize.value);
            const y = parseInt(textY.value);
            const fillColor = textColor.value;
            const outlineColor = strokeColor.value;
            const outlineWidth = parseInt(strokeWidth.value);
            
            ctx.font = `bold ${size}px Arial, sans-serif`;
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            
            const x = canvas.width / 2;
            
            if (outlineWidth > 0) {
                ctx.strokeStyle = outlineColor;
                ctx.lineWidth = outlineWidth;
                ctx.strokeText(text, x, y);
            }
            
            ctx.fillStyle = fillColor;
            ctx.fillText(text, x, y);
        }
        
        updateBtn.addEventListener('click', drawImage);
        
        newText.addEventListener('input', drawImage);
        fontSize.addEventListener('input', drawImage);
        textY.addEventListener('input', drawImage);
        textColor.addEventListener('input', drawImage);
        strokeColor.addEventListener('input', drawImage);
        strokeWidth.addEventListener('input', drawImage);
        
        downloadBtn.addEventListener('click', function() {
            const link = document.createElement('a');
            link.download = 'vortex-prime-bg.jpg';
            link.href = canvas.toDataURL('image/jpeg', 0.95);
            link.click();
        });
    </script>
</body>
</html>
