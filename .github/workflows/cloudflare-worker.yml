name: Deploy Cloudflare API

on:
  push:
    branches: [main]
    paths:
      - "cloudflare/**"
      - ".github/workflows/cloudflare-worker.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Upload Worker version without changing routes
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: versions upload -c wrangler.ci.toml --keep-vars --tag ${{ github.sha }} --message "GitHub Actions ${{ github.sha }}"

      - name: Deploy uploaded version to existing production routes
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CF_API_TOKEN }}
          accountId: ${{ secrets.CF_ACCOUNT_ID }}
          workingDirectory: cloudflare
          command: versions deploy -c wrangler.ci.toml --version-tag ${{ github.sha }}@100% --yes --message "GitHub Actions ${{ github.sha }}"
