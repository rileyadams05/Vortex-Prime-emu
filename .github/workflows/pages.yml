name: Deploy GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Stamp service worker version
        # Replaces the __BUILD_TS__ placeholder in app-sw.js with the current
        # Unix timestamp so every deployment generates a unique cache version.
        # Old caches are then wiped automatically by the SW activate handler.
        run: |
          TS=$(date +%s)
          sed -i "s/__BUILD_TS__/${TS}/g" docs/app-sw.js

      - name: Upload Site
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5

      - name: Purge Cloudflare Cache
        run: |
          echo "Attempting to purge Cloudflare cache for vortex-prime-emu.com..."
          ZONE_ID=$(curl -s -X GET "https://api.cloudflare.com/client/v4/zones?name=vortex-prime-emu.com" -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" -H "Content-Type: application/json" | jq -r '.result[0].id // empty')
          if [ -n "$ZONE_ID" ]; then
            RESPONSE=$(curl -s -X POST "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/purge_cache" -H "Authorization: Bearer ${{ secrets.CF_API_TOKEN }}" -H "Content-Type: application/json" --data '{"purge_everything":true}')
            echo "Purge response: $RESPONSE"
          else
            echo "Warning: Could not fetch Zone ID. Token might lack Zone Read permissions or is missing."
          fi
        continue-on-error: true
