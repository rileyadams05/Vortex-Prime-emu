name: Build macOS Desktop App

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-macos:
    name: Build ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
            output-folder: Intel
            artifact-name: vortex-prime-macos-intel
          - name: Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
            output-folder: Apple-Silicon
            artifact-name: vortex-prime-macos-apple-silicon

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install desktop dependencies
        working-directory: desktop
        run: npm ci

      - name: Build macOS DMG
        working-directory: desktop
        run: npx tauri build --target ${{ matrix.target }} -b dmg

      - name: Stage organized artifact
        shell: bash
        run: |
          set -euo pipefail
          output_dir="macos-artifacts/Releases/PC/Mac OS/${{ matrix.output-folder }}"
          mkdir -p "$output_dir"

          dmg_path="$(find "desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg" -maxdepth 1 -type f -name "*.dmg" | head -n 1)"
          if [ -z "$dmg_path" ]; then
            echo "No DMG produced for ${{ matrix.target }}" >&2
            exit 1
          fi

          cp "$dmg_path" "$output_dir/Vortex Prime.dmg"
          test -f "$output_dir/Vortex Prime.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.artifact-name }}
          path: macos-artifacts
          if-no-files-found: error
