name: PSX WebKit Sender Tests

on:
  push:
    branches: [codex/psx-webkit-website]
    paths:
      - "docs/assets/js/psx-webkit-sender.mjs"
      - "docs/psx-webkit/**"
      - "tools/psx-webkit-*.mjs"
      - ".github/workflows/psx-webkit-tests.yml"
  pull_request:
    paths:
      - "docs/assets/js/psx-webkit-sender.mjs"
      - "docs/psx-webkit/**"
      - "tools/psx-webkit-*.mjs"
      - ".github/workflows/psx-webkit-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sender-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - run: node --test tools/psx-webkit-sender.test.mjs
