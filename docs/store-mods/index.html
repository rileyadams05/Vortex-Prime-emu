<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vortex Prime Store Mods</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <style>
    :root {
      --color-primary: #10B981;
      --color-primary-light: #34D399;
      --color-bg-dark: #09090B;
      --color-bg-elevated: #27272A;
      --color-border: #3F3F46;
      --color-text: #FAFAFA;
      --color-text-secondary: #A1A1AA;
      --color-text-muted: #71717A;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      min-height: 100vh;
      font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background:
        linear-gradient(rgba(16, 185, 129, 0.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(16, 185, 129, 0.025) 1px, transparent 1px),
        var(--color-bg-dark);
      background-size: 60px 60px;
      color: var(--color-text);
    }

    nav {
      min-height: 110px;
      display: flex;
      align-items: center;
      justify-content: center;
      border-bottom: 1px solid var(--color-border);
      background: rgba(9, 9, 11, 0.82);
    }

    .nav-links { display: flex; align-items: center; gap: 0.5rem; flex-wrap: wrap; justify-content: center; }

    .nav-link {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      padding: 0.625rem 1rem;
      border-radius: 8px;
      color: var(--color-text-secondary);
      font-size: 0.9rem;
      font-weight: 500;
      text-decoration: none;
    }

    .nav-link:hover,
    .nav-link.active {
      background: var(--color-bg-elevated);
      color: var(--color-primary-light);
    }

    main {
      max-width: 1100px;
      margin: 0 auto;
      padding: 4rem 1.5rem 6rem;
      text-align: center;
    }

    h1 {
      font-size: 2.25rem;
      line-height: 1.1;
      margin-bottom: 1rem;
    }

    .intro {
      max-width: 560px;
      margin: 0 auto 1.5rem;
      color: var(--color-text-secondary);
      line-height: 1.6;
    }

    .btn {
      min-height: 44px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.75rem;
      padding: 0.8rem 1.5rem;
      border-radius: 8px;
      border: 0;
      background: var(--color-primary);
      color: #fff;
      font-weight: 700;
      text-decoration: none;
      box-shadow: 0 4px 12px rgba(16, 185, 129, 0.22);
    }

    .search-wrap {
      max-width: 760px;
      margin: 1.5rem auto 0;
    }

    .search-field {
      min-height: 72px;
      display: flex;
      align-items: center;
      gap: 1rem;
      padding: 0 1.25rem;
      border: 1px solid var(--color-border);
      border-radius: 12px;
      background: rgba(39, 39, 42, 0.72);
    }

    .search-field svg { width: 18px; height: 18px; fill: var(--color-text-muted); flex: 0 0 auto; }

    .search-field input {
      width: 100%;
      border: 0;
      outline: 0;
      background: transparent;
      color: var(--color-text);
      font: inherit;
      font-size: 1.05rem;
    }

    .platforms {
      display: flex;
      justify-content: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin: 1.25rem auto 0;
    }

    .platform {
      min-height: 40px;
      padding: 0.625rem 1rem;
      border: 1px solid var(--color-border);
      border-radius: 8px;
      background: transparent;
      color: var(--color-text-secondary);
      font-weight: 500;
      cursor: pointer;
    }

    .platform.active {
      border-color: var(--color-primary);
      background: var(--color-primary);
      color: #fff;
      font-weight: 700;
    }

    .hint {
      margin-top: 0.7rem;
      color: var(--color-text-muted);
      font-size: 0.85rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 2rem;
      margin-top: 2rem;
      text-align: left;
    }

    .slot {
      min-height: 220px;
      border: 1px dashed rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.01);
      opacity: 0.35;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .slot::before {
      content: attr(data-index);
      position: absolute;
      top: 0.75rem;
      left: 0.75rem;
      color: rgba(255,255,255,0.65);
      font-weight: 700;
      font-size: 0.85rem;
    }

    @media (max-width: 760px) {
      nav { min-height: 84px; padding: 1rem; }
      .grid { grid-template-columns: 1fr; }
      main { padding-top: 2.5rem; }
    }
  </style>
</head>
<body>
  <nav>
    <div class="nav-links">
      <a href="/" class="nav-link">Home</a>
      <a href="/store/" class="nav-link">Store</a>
      <a href="/store-mods/" class="nav-link active">Store Mods</a>
      <a href="/games/" class="nav-link">Games</a>
      <a href="https://www.reddit.com/r/Vortex_Prime_HB_store/" class="nav-link" target="_blank" rel="noopener">Discussions</a>
      <a href="https://discord.gg/TwMsbb97Mm" class="nav-link" target="_blank" rel="noopener">Community</a>
      <a href="https://github.com/rileyadams05/Vortex-Prime-emu/wiki" class="nav-link" target="_blank" rel="noopener">Docs</a>
      <a href="https://discord.gg/PVFJ64QA" class="nav-link" target="_blank" rel="noopener">Help</a>
    </div>
  </nav>

  <main>
    <h1>Store Mods</h1>
    <p class="intro">Browse mod-focused Vortex Prime content separately from the main app store.</p>

    <a class="btn" href="/admin/?type=mods">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="currentColor" aria-hidden="true"><path d="M5 20h14v-2H5v2zM19 9h-4V3H9v6H5l7 7 7-7z"/></svg>
      Upload
    </a>

    <section class="search-wrap">
      <label class="search-field">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.5 14h-.79l-.28-.27A6.471 6.471 0 0 0 16 9.5 6.5 6.5 0 1 0 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
        <input type="text" placeholder="Search by mod's name or creator name" autocomplete="off" spellcheck="false">
      </label>

      <div class="platforms" aria-label="Mod platform filters">
        <button class="platform active" type="button">All Platforms</button>
        <button class="platform" type="button">PS5</button>
        <button class="platform" type="button">PS4</button>
        <button class="platform" type="button">PS3</button>
        <button class="platform" type="button">PS2</button>
        <button class="platform" type="button">PS Vita</button>
        <button class="platform" type="button">PSP</button>
        <button class="platform" type="button">Original Xbox</button>
        <button class="platform" type="button">Xbox 360</button>
      </div>

      <p class="hint">Search by mod's name or creator name.</p>
    </section>

    <section class="grid" aria-label="Store Mods results">
      <div class="slot" data-index="#1"></div>
      <div class="slot" data-index="#2"></div>
      <div class="slot" data-index="#3"></div>
      <div class="slot" data-index="#4"></div>
    </section>
  </main>

  <script>
    document.querySelectorAll('.platform').forEach((button) => {
      button.addEventListener('click', () => {
        document.querySelectorAll('.platform').forEach((item) => item.classList.remove('active'));
        button.classList.add('active');
      });
    });
  </script>
</body>
</html>
