<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="The Vortex Prime BGFT Service has been retired.">
  <title>BGFT retired | Vortex Prime</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif;background:#09090b;color:#fafafa}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px}
    main{width:min(680px,100%);padding:clamp(24px,5vw,48px);border:1px solid #3f3f46;border-radius:18px;background:#18181b}
    h1{margin:0 0 12px;font-size:clamp(2rem,6vw,3.2rem)}p{color:#cbd5e1;line-height:1.7}
    a{color:#34d399}a.button{display:inline-flex;min-height:44px;align-items:center;padding:10px 16px;border-radius:9px;background:#27272a;text-decoration:none}
  </style>
</head>
<body>
  <main>
    <h1>BGFT Service has been retired</h1>
    <p>This Vortex Prime web app is discontinued. It no longer offers PS4 package installation or a BGFT PWA.</p>
    <p>Vortex Prime currently maintains NXE, ModX, and FPKG Builder.</p>
    <a class="button" href="/">Return to Vortex Prime</a>
  </main>
  <script>
    (async () => {
      if ('serviceWorker' in navigator) {
        const registrations = await navigator.serviceWorker.getRegistrations();
        const retiredScope = new URL('/bgft/', location.origin).href;
        await Promise.all(registrations.filter((registration) => registration.scope === retiredScope).map((registration) => registration.unregister()));
      }
      if ('caches' in window) {
        const names = await caches.keys();
        await Promise.all(names.filter((name) => name.startsWith('bgft-shell-')).map((name) => caches.delete(name)));
      }
    })().catch(() => {});
  </script>
</body>
</html>
