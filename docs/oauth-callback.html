<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Discord Authentication</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #09090B;
            color: #FAFAFA;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 2rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 1rem;
            border: 3px solid rgba(16, 185, 129, 0.2);
            border-top-color: #10B981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        .error {
            color: #F87171;
        }
        .success {
            color: #10B981;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div class="status" id="status">Processing Discord authentication...</div>
    </div>

    <script>
        const statusEl = document.getElementById('status');

        async function handleCallback() {
            try {
                // Check for error in URL hash
                const hash = window.location.hash.substring(1);
                const params = new URLSearchParams(hash);
                
                const error = params.get('error');
                if (error) {
                    const errorDesc = params.get('error_description');
                    const fullError = errorDesc ? `${error}: ${errorDesc}` : error;
                    statusEl.textContent = `Authentication failed: ${fullError}`;
                    statusEl.classList.add('error');
                    
                    if (window.opener) {
                        window.opener.postMessage({
                            type: 'DISCORD_AUTH_ERROR',
                            error: fullError
                        }, window.location.origin);
                    }
                    
                    setTimeout(() => window.close(), 3000);
                    return;
                }

                // Get access token from URL hash
                const accessToken = params.get('access_token');
                
                if (!accessToken) {
                    statusEl.textContent = 'No access token received';
                    statusEl.classList.add('error');
                    setTimeout(() => window.close(), 3000);
                    return;
                }

                // Fetch user profile from Discord
                const response = await fetch('https://discord.com/api/users/@me', {
                    headers: {
                        'Authorization': `Bearer ${accessToken}`
                    }
                });

                if (!response.ok) {
                    throw new Error('Failed to fetch Discord profile');
                }

                const data = await response.json();
                
                // Construct profile picture URL
                const profilePicture = data.avatar 
                    ? `https://cdn.discordapp.com/avatars/${data.id}/${data.avatar}.png`
                    : `https://cdn.discordapp.com/embed/avatars/${(parseInt(data.discriminator) || 0) % 5}.png`;

                const profile = {
                    name: data.global_name || data.username,
                    discordId: data.id,
                    profilePicture: profilePicture,
                    provider: 'discord',
                    accessToken: accessToken
                };

                statusEl.textContent = 'Success! Redirecting...';
                statusEl.classList.add('success');

                // Send profile to parent window
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'DISCORD_AUTH_SUCCESS',
                        profile: profile
                    }, window.location.origin);
                    setTimeout(() => window.close(), 1000);
                } else {
                    // Fallback if not opened in popup
                    localStorage.setItem('discordUser', JSON.stringify(profile));
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                }

            } catch (error) {
                console.error('OAuth callback error:', error);
                statusEl.textContent = `Error: ${error.message}`;
                statusEl.classList.add('error');
                
                if (window.opener) {
                    window.opener.postMessage({
                        type: 'DISCORD_AUTH_ERROR',
                        error: error.message
                    }, window.location.origin);
                }
                
                setTimeout(() => window.close(), 3000);
            }
        }

        handleCallback();
    </script>
</body>
</html>
