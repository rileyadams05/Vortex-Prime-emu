<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signing you in…</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #09090B;
            color: #FAFAFA;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
        }
        .container {
            max-width: 400px;
            padding: 2rem;
        }
        .spinner {
            width: 40px;
            height: 40px;
            margin: 0 auto 1rem;
            border: 3px solid rgba(16, 185, 129, 0.2);
            border-top-color: #10B981;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            to { transform: rotate(360deg); }
        }
        .status {
            font-size: 1.1rem;
            margin-bottom: 0.5rem;
        }
        .error {
            color: #F87171;
        }
        .success {
            color: #10B981;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="spinner"></div>
        <div class="status" id="status">Finalizing GitHub sign‑in…</div>
    </div>

    <script>
        const statusEl = document.getElementById('status');

        (function finalizeGithub() {
          try {
            const qs = window.location.search;
            if (!qs || qs.length < 3) {
              statusEl.textContent = 'Missing OAuth parameters.';
              statusEl.classList.add('error');
              setTimeout(() => window.location.href = '/admin/', 1500);
              return;
            }
            // Hand off to Worker to set secure session and redirect to /admin/
            const target = '/api/github/callback' + qs;
            window.location.replace(target);
          } catch (e) {
            console.error(e);
            statusEl.textContent = 'Authentication failed.';
            statusEl.classList.add('error');
            setTimeout(() => window.location.href = '/admin/', 1500);
          }
        })();
    </script>
</body>
</html>
