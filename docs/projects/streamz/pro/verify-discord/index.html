<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Streamz Pro Verification</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root { font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f8fafc; background: #05070b; }
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.25rem; background: radial-gradient(circle at top, rgba(99,102,241,.16), transparent 55%), #05070b; }
    main { width: min(640px, 100%); background: rgba(12,17,26,.96); border: 1px solid rgba(255,255,255,.1); border-radius: 22px; padding: clamp(1.4rem, 4vw, 2.4rem); box-shadow: 0 24px 70px rgba(0,0,0,.45); }
    .eyebrow { color: #a5b4fc; font-size: .78rem; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; margin-bottom: .55rem; }
    h1 { margin: 0 0 .75rem; font-size: clamp(1.75rem, 6vw, 2.45rem); line-height: 1.1; }
    p { margin: 0 0 1rem; color: #cbd5e1; line-height: 1.55; }
    .status { display: inline-flex; border-radius: 999px; padding: .35rem .85rem; margin-bottom: 1rem; font-size: .85rem; font-weight: 800; border: 1px solid rgba(59,130,246,.35); background: rgba(59,130,246,.14); color: #bfdbfe; }
    .status[data-variant="success"] { border-color: rgba(16,185,129,.4); background: rgba(16,185,129,.14); color: #86efac; }
    .status[data-variant="error"] { border-color: rgba(248,113,113,.4); background: rgba(248,113,113,.14); color: #fecaca; }
    .actions { display: flex; flex-wrap: wrap; gap: .75rem; margin-top: 1.1rem; }
    a { color: #fff; text-decoration: none; border: 1px solid rgba(255,255,255,.16); border-radius: 999px; padding: .75rem 1.05rem; font-weight: 800; }
    a.primary { border-color: transparent; background: linear-gradient(120deg, #6366f1, #8b5cf6); }
    #googleButton { margin-top: 1rem; }
  </style>
</head>
<body>
  <main>
    <div id="status" class="status">Loading</div>
    <div class="eyebrow">Streamz Pro</div>
    <h1 id="title">Streamz Pro verification</h1>
    <p id="message">Checking your Discord verification session...</p>
    <div id="googleButton" hidden></div>
    <div id="actions" class="actions" hidden></div>
  </main>

  <script>
    const token = new URLSearchParams(window.location.search).get('token') || '';
    const statusEl = document.getElementById('status');
    const titleEl = document.getElementById('title');
    const messageEl = document.getElementById('message');
    const googleButton = document.getElementById('googleButton');
    const actionsEl = document.getElementById('actions');

    function setState({ status = 'loading', title, message, variant = 'info', google = false }) {
      statusEl.textContent = status;
      statusEl.setAttribute('data-variant', variant);
      titleEl.textContent = title || 'Streamz Pro verification';
      messageEl.textContent = message || '';
      googleButton.hidden = !google;
      actionsEl.hidden = false;
      actionsEl.innerHTML = status === 'success' || status === 'already_active'
        ? '<a class="primary" href="streamz://account/pro">Open Streamz</a><a href="/projects/streamz/pro/">Return to Vortex Prime</a>'
        : '<a href="/projects/streamz/pro/">Return to Streamz Pro</a>';
    }

    async function loadGoogleButton() {
      const resp = await fetch('/api/auth/config', { credentials: 'include' });
      const config = await resp.json();
      if (!config.googleClientId) throw new Error('Google sign-in is not configured.');
      await new Promise((resolve, reject) => {
        const started = Date.now();
        const timer = setInterval(() => {
          if (window.google?.accounts?.id) {
            clearInterval(timer);
            resolve();
          } else if (Date.now() - started > 6000) {
            clearInterval(timer);
            reject(new Error('Google sign-in failed to load.'));
          }
        }, 75);
      });
      google.accounts.id.initialize({
        client_id: config.googleClientId,
        callback: linkWithGoogle,
        auto_select: false,
      });
      google.accounts.id.renderButton(googleButton, {
        theme: 'outline',
        size: 'large',
        shape: 'pill',
        text: 'continue_with',
      });
    }

    async function checkToken() {
      if (!token) {
        setState({ status: 'Invalid', title: 'This verification link is invalid', message: 'The link may be incomplete, expired or replaced.', variant: 'error' });
        return;
      }
      window.history.replaceState({}, document.title, window.location.pathname);
      const url = new URL('/api/streamz/pro/verify-discord', window.location.origin);
      url.searchParams.set('token', token);
      const resp = await fetch(url);
      const data = await resp.json().catch(() => ({}));
      if (!resp.ok || !data.ok) {
        setState({ status: data.status || 'Error', title: data.title || 'We could not verify your account', message: data.message || 'Try again from the Discord verification message.', variant: 'error' });
        return;
      }
      setState({
        status: 'Google required',
        title: data.title,
        message: `${data.message}\n\nStreamz Pro is a one-time purchase and will be permanently linked to the Google account used during activation. You are responsible for maintaining access to that account. If access is permanently lost, licence recovery or transfer is not guaranteed and a new purchase may be required, except where required by applicable law.`,
        google: true,
      });
      await loadGoogleButton();
    }

    async function linkWithGoogle(response) {
      if (!response?.credential) {
        setState({ status: 'Error', title: 'We could not verify your account', message: 'Google did not return a credential. Try again.', variant: 'error', google: true });
        return;
      }
      setState({ status: 'Linking', title: 'Linking Streamz Pro', message: 'Please wait while Vortex Prime links Streamz Pro to your Google account.' });
      const resp = await fetch('/api/streamz/pro/verify-discord', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        credentials: 'include',
        body: JSON.stringify({ token, credential: response.credential }),
      });
      const data = await resp.json().catch(() => ({}));
      setState({
        status: data.status || (resp.ok ? 'success' : 'error'),
        title: data.title || (resp.ok ? 'Streamz Pro activated' : 'We could not verify your account'),
        message: data.message || 'Try again from the Discord verification message.',
        variant: resp.ok && data.ok ? 'success' : 'error',
      });
    }

    checkToken().catch(() => {
      setState({ status: 'Error', title: 'We could not verify your account', message: 'Try again from the Discord verification message.', variant: 'error' });
    });
  </script>
</body>
</html>
