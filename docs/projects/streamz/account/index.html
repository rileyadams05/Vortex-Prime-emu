<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Streamz Account | Vortex Prime</title>
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <style>
    :root { color-scheme: dark; --bg:#07080b; --panel:#111319; --border:#252936; --text:#f7f8fb; --muted:#a5adbd; --accent:#7c6cf0; --ok:#22c55e; --warn:#f59e0b; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px; font-family:Inter,system-ui,Segoe UI,sans-serif; background:var(--bg); color:var(--text); }
    main { width:min(520px,100%); display:grid; gap:18px; padding:28px; border:1px solid var(--border); border-radius:12px; background:var(--panel); box-shadow:0 24px 80px rgba(0,0,0,.35); }
    h1 { margin:0; font-size:24px; }
    p { margin:0; color:var(--muted); line-height:1.55; }
    .status { padding:12px 14px; border:1px solid var(--border); border-radius:8px; background:#0b0d12; color:var(--muted); white-space:pre-line; }
    .status[data-kind="ok"] { border-color:rgba(34,197,94,.45); color:#bbf7d0; }
    .status[data-kind="warn"] { border-color:rgba(245,158,11,.45); color:#fde68a; }
    .actions { display:flex; gap:10px; flex-wrap:wrap; }
    a { color:var(--text); text-decoration:none; }
    .button { display:inline-flex; align-items:center; justify-content:center; min-height:42px; padding:0 14px; border-radius:8px; border:1px solid var(--border); background:#171a22; font-weight:700; }
    .button.primary { background:var(--accent); border-color:var(--accent); }
  </style>
</head>
<body>
  <main>
    <h1>Streamz account</h1>
    <p>Sign in with the Vortex Prime Google account that owns your Streamz Pro licence. YouTube channel connection is handled separately inside Streamz.</p>
    <div id="googleButton"></div>
    <div class="status" id="status" data-kind="warn">Checking account status...</div>
    <div class="actions">
      <a class="button primary" href="/projects/streamz/pro/">Upgrade to Pro</a>
      <a class="button" href="/">Return to Vortex Prime</a>
    </div>
  </main>
  <script>
    const statusEl = document.getElementById('status');
    const googleButton = document.getElementById('googleButton');

    function setStatus(message, kind = 'warn') {
      statusEl.textContent = message;
      statusEl.dataset.kind = kind;
    }

    async function waitForGoogle() {
      const started = Date.now();
      while (!window.google?.accounts?.id) {
        if (Date.now() - started > 8000) throw new Error('Google sign-in did not load. Refresh the page and try again.');
        await new Promise((resolve) => setTimeout(resolve, 100));
      }
    }

    async function api(path, options) {
      const response = await fetch(path, { credentials: 'include', ...(options || {}) });
      const data = await response.json().catch(() => ({}));
      if (!response.ok) throw new Error(data.message || data.error || `Request failed: ${response.status}`);
      return data;
    }

    async function checkEntitlement() {
      try {
        const data = await api('/api/streamz/pro/entitlement');
        if (data.ownsPro && data.status === 'active') {
          setStatus('Streamz Pro is active for this Vortex Prime Google account.', 'ok');
        } else {
          setStatus('Signed in. Streamz Pro is not active for this Vortex Prime Google account.', 'warn');
        }
      } catch (error) {
        setStatus(error.message || 'Sign in to check Streamz Pro ownership.', 'warn');
      }
    }

    async function init() {
      try {
        const config = await api('/api/auth/config');
        if (!config.googleClientId) throw new Error('Vortex Prime Google sign-in is not configured.');
        await waitForGoogle();
        google.accounts.id.initialize({
          client_id: config.googleClientId,
          callback: async (response) => {
            if (!response.credential) return setStatus('Google did not return a credential.', 'warn');
            await api('/api/auth/login', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ credential: response.credential }),
            });
            await checkEntitlement();
          },
        });
        google.accounts.id.renderButton(googleButton, { theme: 'outline', size: 'large', shape: 'pill' });
        await checkEntitlement();
      } catch (error) {
        setStatus(error.message || 'Unable to load Vortex Prime account sign-in.', 'warn');
      }
    }

    init();
  </script>
</body>
</html>
