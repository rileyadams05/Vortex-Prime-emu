<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PS4 GoldHEN Host - Vortex Prime</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #1a1920;
        color: #fff;
        font-family: Arial, sans-serif;
        text-align: center;
      }

      body {
        padding: 24px 12px;
      }

      h1 {
        color: yellow;
        font-size: 28px;
        margin: 0 0 12px;
        text-shadow: 4px 4px 4px #000;
      }

      p {
        color: #ddd;
        font-size: 18px;
        line-height: 1.45;
        margin: 8px auto 18px;
        max-width: 820px;
      }

      form {
        margin: 18px auto;
      }

      input {
        width: 220px;
        height: 44px;
        border: 2px solid #000;
        border-radius: 8px;
        font-size: 24px;
        text-align: center;
        background: #fff;
        color: #000;
      }

      button,
      .button {
        display: inline-block;
        min-width: 180px;
        height: 42px;
        line-height: 42px;
        margin: 7px;
        padding: 0 12px;
        border: 2px solid #000;
        border-radius: 10px;
        background: rgba(0, 0, 0, 0.5);
        box-shadow: 0 5px 20px 0 #fff;
        color: yellow;
        font-size: 20px;
        font-weight: bold;
        text-decoration: none;
      }

      button:hover,
      .button:hover {
        background: #0f0f53;
        color: #fff;
        box-shadow: 0 5px 50px 0 #fff;
      }

      .panel {
        width: 92%;
        max-width: 900px;
        margin: 18px auto;
        padding: 18px;
        border-radius: 18px;
        background: rgba(0, 0, 0, 0.42);
      }

      #message {
        min-height: 24px;
        color: #fff;
        font-size: 20px;
        font-weight: bold;
      }
    </style>
    <script>
      function cleanFirmware(value) {
        value = String(value || '');
        value = value.replace(/[^0-9.]/g, '');
        value = value.replace(/\.+/g, '.');
        value = value.replace(/^\./, '');
        value = value.replace(/\.$/, '');

        if (value === '505') return '5.05';
        if (value === '672') return '6.72';
        if (value === '900') return '9.00';
        if (value === '5') return '5.05';
        if (value === '6') return '6.72';
        if (value === '9') return '9.00';

        if (value === '5.5') return '5.05';
        if (value === '6.7') return '6.72';
        if (value === '9.0') return '9.00';

        return value;
      }

      function hostForFirmware(firmware) {
        firmware = cleanFirmware(firmware);
        if (firmware === '5.05') return '/ps4/karo218/Goldhen505/index.html';
        if (firmware === '6.72') return '/ps4/karo218/Goldhen672/index.html';
        if (firmware === '9.00') return '/ps4/karo218/G900/index.html';
        return '';
      }

      function openSelectedHost() {
        var input = document.getElementById('firmware');
        var message = document.getElementById('message');
        var firmware = cleanFirmware(input ? input.value : '');
        var host = hostForFirmware(firmware);

        if (host) {
          if (message) message.innerHTML = 'Opening KARO218 GoldHEN host for firmware ' + firmware + '...';
          window.location.href = host;
          return false;
        }

        if (message) {
          message.innerHTML = 'No direct KARO218 GoldHEN page is wired for "' + firmware + '". Use 5.05, 6.72, or 9.00.';
        }
        return false;
      }
    </script>
  </head>
  <body>
    <h1>Vortex Prime PS4 GoldHEN Host</h1>
    <p>This page opens the restored KARO218 GoldHEN exploit host files from the public Vortex Prime site.</p>

    <div class="panel">
      <form onsubmit="return openSelectedHost();">
        <p>Type your PS4 firmware:</p>
        <input id="firmware" name="firmware" type="text" value="" placeholder="9.00">
        <button type="submit">Open Host</button>
      </form>
      <div id="message">Supported direct hosts: 5.05, 6.72, 9.00</div>
    </div>

    <div class="panel">
      <p>Direct KARO218 GoldHEN hosts:</p>
      <a class="button" href="/ps4/karo218/Goldhen505/index.html">GoldHEN 5.05</a>
      <a class="button" href="/ps4/karo218/Goldhen672/index.html">GoldHEN 6.72</a>
      <a class="button" href="/ps4/karo218/G900/index.html">GoldHEN 9.00</a>
    </div>
  </body>
</html>
