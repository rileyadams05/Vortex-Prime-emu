<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>External link check | Vortex Prime</title>
  <style>
    :root{color-scheme:dark;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#090b10;color:#f8fafc}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:1.25rem}
    main{width:min(620px,100%);padding:2rem;border:1px solid #273244;border-radius:18px;background:#111722}
    h1{margin:0 0 .75rem;font-size:clamp(1.7rem,5vw,2.2rem)}p{color:#cbd5e1;line-height:1.65}
    #destination-host{font-weight:800;color:#fff;overflow-wrap:anywhere}
    .actions{display:flex;gap:.75rem;flex-wrap:wrap;margin-top:1.5rem}
    button{border:1px solid #3b465a;border-radius:999px;padding:.75rem 1.2rem;background:#1c2635;color:#fff;font:inherit;font-weight:700;cursor:pointer}
    #continue-btn{background:#2563eb;border-color:#2563eb}button:disabled{opacity:.5;cursor:not-allowed}
    #error{color:#fca5a5}a{color:#93c5fd}
  </style>
</head>
<body>
  <main>
    <h1>Leaving Vortex Prime</h1>
    <p>You’re opening an external project link. Check the destination before continuing:</p>
    <p id="destination-host">Checking link…</p>
    <p id="error" role="alert" hidden></p>
    <div class="actions">
      <button id="cancel-btn" type="button">Cancel</button>
      <button id="continue-btn" type="button" disabled>Continue</button>
    </div>
    <p>This check only permits links to the original GitHub, Internet Archive and Reddit project pages.</p>
  </main>
  <script>
    const hosts=new Set(["github.com","raw.githubusercontent.com","objects.githubusercontent.com","archive.org","reddit.com","www.reddit.com"]);
    const hostLabel=document.getElementById("destination-host"),error=document.getElementById("error"),go=document.getElementById("continue-btn");
    let target=null;
    try{
      const candidate=new URL(new URLSearchParams(location.search).get("to")||"");
      if(candidate.protocol!=="https:"||!hosts.has(candidate.hostname.toLowerCase()))throw new Error("This destination is not on the approved external-link list.");
      target=candidate;hostLabel.textContent=candidate.hostname;
      go.disabled=false;
      go.addEventListener("click",()=>{if(target)location.assign(target.href)});
    }catch(e){hostLabel.textContent="Link unavailable";error.textContent=e.message||"The destination link is invalid.";error.hidden=false}
    document.getElementById("cancel-btn").addEventListener("click",()=>{if(history.length>1)history.back();else location.assign("/")});
  </script>
</body>
</html>
