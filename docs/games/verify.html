<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verification • Vortex Prime</title>
  <link rel="preconnect" href="https://challenges.cloudflare.com" crossorigin>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <style>
    :root{
      --bg:#0b0b0b; --card:#121212; --border:#262626; --text:#e5e7eb; --muted:#9ca3af; --accent:#10b981;
    }
    html,body{height:100%;}
    body{margin:0; background:radial-gradient(1200px 800px at 85% 90%, rgba(16,185,129,.08), transparent 40%),
                   radial-gradient(1000px 700px at 10% 10%, rgba(59,130,246,.08), transparent 35%), var(--bg);
         color:var(--text); font-family: system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
    }
    .wrap{min-height:100%; display:flex; align-items:center; justify-content:center; padding:24px;}
    .card{width:100%; max-width:520px; background:var(--card); border:1px solid var(--border); border-radius:14px; box-shadow:0 15px 45px rgba(0,0,0,.6); padding:24px;}
    h1{font-size:1.25rem; margin:0 0 .25rem 0;}
    p{color:var(--muted); margin:.25rem 0 1rem 0; line-height:1.5;}
    .actions{margin-top:14px; display:flex; align-items:center; gap:.75rem;}
    .btn{display:inline-flex; align-items:center; gap:.5rem; padding:.6rem 1rem; border:1px solid var(--border); color:var(--text); text-decoration:none; border-radius:8px; transition:all .2s; background:transparent; cursor:pointer;}
    .btn:hover{color:#fff; border-color:#3f3f46;}
    .note{margin-top:12px; color:var(--muted); font-size:.9rem;}
    .center{display:flex; justify-content:center;}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card" role="main" aria-labelledby="v-title">
      <h1 id="v-title">Human check</h1>
      <p>Complete the verification to continue to the external Reddit discussion in a new tab.</p>
      <div class="center">
        <div class="cf-turnstile" data-sitekey="0x4AAAAAADMDGaAx-NMsil-r" data-theme="dark" data-callback="onTurnstileSuccess"></div>
      </div>
      <div class="note" id="statusNote" aria-live="polite"></div>
      <div class="actions">
        <a class="btn" href="/" aria-label="Back to Games">Back</a>
      </div>
    </div>
  </div>
  <script>
    const REDDIT_URL = 'https://www.reddit.com/r/ps4piracy/comments/1cw34vw/can_someone_tell_me_the_proper_way_to_download/';
    // Configure your Cloudflare Worker/API route to verify Turnstile server-side
    const VERIFY_ENDPOINT = 'https://vortex-prime-emu.com/api/turnstile-verify';

    async function onTurnstileSuccess(token){
      const note = document.getElementById('statusNote');
      try {
        if (note) note.textContent = 'Verifying…';
        const res = await fetch(VERIFY_ENDPOINT, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token }),
          mode: 'cors',
          credentials: 'omit'
        });
        const data = await res.json().catch(() => ({}));
        if (res.ok && data && data.success) {
          window.open(REDDIT_URL, '_blank', 'noopener,noreferrer');
          if (note) note.textContent = 'Verified. The discussion has been opened in a new tab.';
        } else {
          if (note) note.textContent = 'Verification failed. Please refresh and try again.';
        }
      } catch (e) {
        if (note) note.textContent = 'Verification service is unavailable. Please try again later.';
      }
    }
  </script>
</body>
</html>
