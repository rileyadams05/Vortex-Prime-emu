<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Vortex Prime · Store Upload Portal</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #09090b;
      --surface: #18181b;
      --elevated: #27272a;
      --border: #3f3f46;
      --text: #fafafa;
      --muted: #a1a1aa;
      --primary: #10b981;
      --primary-dark: #059669;
      --danger: #ef4444;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; }
    header { background: rgba(9,9,11,.85); backdrop-filter: blur(16px); border-bottom: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; position: sticky; top: 0; z-index: 50; }
    header img { width: 40px; height: 40px; }
    header h1 { font-size: 1.1rem; font-weight: 700; }
    header p { font-size: .8rem; color: var(--muted); }
    .header-right { margin-left: auto; display: flex; gap: .75rem; align-items: center; flex-wrap: wrap; }
    main { max-width: 960px; margin: 0 auto; padding: 2rem; }
    .notice { background: rgba(16,185,129,.08); border: 1px solid rgba(16,185,129,.3); border-radius: 12px; padding: 1rem 1.25rem; margin-bottom: 2rem; font-size: .875rem; color: #6ee7b7; line-height: 1.6; }
    .notice strong { color: var(--primary); }
    .notice ol { padding-left: 1.25rem; margin-top: .5rem; }
    .notice ol li { margin-top: .25rem; }
    .card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; overflow: hidden; margin-bottom: 1.5rem; }
    .card-header { padding: 1rem 1.25rem; display: flex; align-items: center; gap: .75rem; cursor: pointer; user-select: none; transition: background .15s; }
    .card-header:hover { background: var(--elevated); }
    .card-header .pkg-name { font-weight: 600; flex: 1; }
    .card-header .pkg-code { font-family: monospace; font-size: .8rem; color: var(--primary); background: rgba(16,185,129,.1); border: 1px solid rgba(16,185,129,.25); padding: .2rem .55rem; border-radius: 6px; }
    .card-header .chevron { transition: transform .2s; color: var(--muted); font-size: .9rem; }
    .card.open .chevron { transform: rotate(180deg); }
    .card-body { display: none; padding: 1.25rem; border-top: 1px solid var(--border); }
    .card.open .card-body { display: block; }
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; }
    @media (max-width: 640px) { .form-grid { grid-template-columns: 1fr; } }
    .field { display: flex; flex-direction: column; gap: .4rem; }
    .field.full { grid-column: 1 / -1; }
    label { font-size: .8rem; font-weight: 500; color: var(--muted); }
    input, textarea { background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: .9rem; padding: .6rem .85rem; outline: none; transition: border-color .2s; width: 100%; }
    input:focus, textarea:focus { border-color: var(--primary); }
    textarea { resize: vertical; min-height: 80px; }
    .tags-input { display: flex; flex-wrap: wrap; gap: .4rem; background: var(--bg); border: 1px solid var(--border); border-radius: 8px; padding: .5rem .75rem; min-height: 42px; cursor: text; }
    .tags-input.focused { border-color: var(--primary); }
    .tag-chip { display: flex; align-items: center; gap: .35rem; background: rgba(16,185,129,.15); border: 1px solid rgba(16,185,129,.3); border-radius: 999px; padding: .15rem .55rem; font-size: .75rem; color: #6ee7b7; }
    .tag-chip button { background: none; border: none; color: inherit; cursor: pointer; padding: 0; line-height: 1; font-size: .9rem; }
    .tags-input input { background: transparent; border: none; outline: none; padding: 0; min-width: 80px; flex: 1; font-size: .85rem; }
    .card-actions { margin-top: 1.25rem; display: flex; gap: .75rem; justify-content: flex-end; flex-wrap: wrap; }
    button { font-family: inherit; cursor: pointer; border: none; border-radius: 8px; font-size: .875rem; font-weight: 500; padding: .55rem 1.1rem; transition: all .2s; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: var(--primary-dark); }
    .btn-danger { background: rgba(239,68,68,.1); color: var(--danger); border: 1px solid rgba(239,68,68,.3); }
    .btn-danger:hover { background: rgba(239,68,68,.2); }
    .btn-secondary { background: var(--elevated); color: var(--text); border: 1px solid var(--border); }
    .btn-secondary:hover { border-color: var(--primary); }
    .btn-success { background: #16a34a; color: #fff; }
    .btn-success:hover { background: #15803d; }
    .add-btn { width: 100%; padding: 1rem; background: rgba(16,185,129,.05); border: 2px dashed rgba(16,185,129,.3); color: var(--primary); border-radius: 12px; font-size: .95rem; font-weight: 600; transition: all .2s; margin-bottom: 1.5rem; }
    .add-btn:hover { background: rgba(16,185,129,.1); border-color: var(--primary); }
    .toolbar { display: flex; gap: .75rem; align-items: center; margin-bottom: 1.5rem; flex-wrap: wrap; }
    .toolbar h2 { font-size: 1.1rem; font-weight: 700; flex: 1; }
    .count-badge { background: var(--elevated); border: 1px solid var(--border); border-radius: 999px; padding: .2rem .7rem; font-size: .8rem; color: var(--muted); }
    .empty-state { text-align: center; padding: 4rem 2rem; color: var(--muted); }
    .empty-state svg { width: 48px; height: 48px; fill: rgba(16,185,129,.5); margin-bottom: 1rem; }
    .empty-state h3 { color: var(--text); margin-bottom: .5rem; }
    .toast { position: fixed; bottom: 2rem; right: 2rem; background: #1c1c1f; border: 1px solid var(--border); border-radius: 12px; padding: .875rem 1.25rem; font-size: .875rem; z-index: 9999; transform: translateY(8px); opacity: 0; transition: all .3s; pointer-events: none; max-width: 320px; }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.success { border-color: rgba(16,185,129,.5); color: #6ee7b7; }
    .toast.error { border-color: rgba(239,68,68,.4); color: #fca5a5; }
    .toast.error { border-color: rgba(239,68,68,.4); color: #fca5a5; }
    #saveBar { position: sticky; bottom: 0; background: rgba(9,9,11,.95); backdrop-filter: blur(16px); border-top: 1px solid var(--border); padding: 1rem 2rem; display: flex; align-items: center; gap: 1rem; z-index: 40; }
    .save-hint { font-size: .8rem; color: var(--muted); flex: 1; }
    .dirty-dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--warning); margin-right: .4rem; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: .4; } }

    /* Upload Zone Styling */
    .upload-zone { 
      background: var(--bg); 
      border: 2px dashed var(--border); 
      border-radius: 12px; 
      padding: 1.5rem; 
      text-align: center; 
      cursor: pointer; 
      transition: all .2s; 
      position: relative;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      min-height: 100px;
      justify-content: center;
    }
    .upload-zone:hover, .upload-zone.dragover { 
      border-color: var(--primary); 
      background: rgba(16,185,129,.05); 
    }
    .upload-zone svg { width: 24px; height: 24px; fill: var(--muted); margin-bottom: 4px; }
    .upload-zone span { font-size: 0.75rem; color: var(--muted); }
    .upload-zone .file-name { font-weight: 600; color: var(--primary); font-size: 0.85rem; word-break: break-all; }
    .preview-wrap { position: relative; width: 100%; display: flex; flex-direction: column; align-items: center; }
    .preview-thumb { width: 64px; height: 64px; border-radius: 12px; object-fit: cover; border: 1px solid var(--border); margin-bottom: 0.5rem; }
    .preview-large { width: 100%; height: 140px; border-radius: 10px; object-fit: cover; border: 1px solid var(--border); margin-bottom: 0.5rem; }
    .upload-hint-box { font-size: 0.65rem; color: rgba(255,255,255,0.4); margin-top: 0.25rem; }
  </style>
</head>
<body>
<header>
  <img src="../icon.svg" alt="Vortex Prime">
  <div>
    <h1>Store Upload Portal</h1>
    <p>Add ZIP packages for Vortex Prime</p>
  </div>
  <div class="header-right">
    <a href="../" style="color:var(--muted);font-size:.85rem;text-decoration:none;">← Back to Store</a>
  </div>
</header>

<main>
  <div class="toolbar">
    <h2>Packages</h2>
    <div style="display: flex; gap: 0.5rem; align-items: center;">
      <span class="count-badge" id="countBadge">0 packages</span>
      <button class="btn-primary" onclick="addPackage(true)" style="padding: 0.4rem 0.8rem; font-size: 0.8rem;">+ Add Package</button>
    </div>
  </div>

  <div id="packageList"></div>
</main>

<div id="saveBar">
  <span class="save-hint" id="saveHint">Add or edit packages above, then upload when ready.</span>
  <button class="btn-success" onclick="downloadJSON()">🚀 Upload to Store</button>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  let packages = [];
  let dirty = false;

  // ── Toast ──────────────────────────────────────────────────────────────────
  function toast(msg, type = 'success') {
    const el = document.getElementById('toast');
    el.textContent = msg;
    el.className = 'toast show ' + type;
    clearTimeout(el._t);
    el._t = setTimeout(() => el.classList.remove('show'), 3200);
  }

  // ── Dirty state ───────────────────────────────────────────────────────────
  function markDirty() {
    dirty = true;
    const hint = document.getElementById('saveHint');
    hint.innerHTML = '<span class="dirty-dot"></span>Unsaved changes — click Upload to Store when ready.';
  }

  // ── Collect current field values into packages array ──────────────────────
  function collectAll() {
    const cards = document.querySelectorAll('.pkg-card');
    packages = Array.from(cards).map(card => {
      const idx = card.dataset.idx;
      const g = (name) => (card.querySelector(`[data-field="${name}"]`) || {}).value || '';
      const tagChips = card.querySelectorAll('.tag-chip');
      const tags = Array.from(tagChips).map(c => c.dataset.tag).filter(Boolean);
      return {
        name: g('name'),
        description: g('description'),
        creator: g('creator'),
        code: g('code'),
        tags,
        icon: g('icon'),
        preview: g('preview'),
        zip_file: g('zip_file'),
        download_url: g('download_url'),
        platform: g('platform') || 'PS4',
        updated: g('updated') || undefined,
      };
    });
  }

  // ── Render all cards ──────────────────────────────────────────────────────
  function render() {
    const list = document.getElementById('packageList');
    const badge = document.getElementById('countBadge');
    
    if (packages.length === 0) {
      addPackage(false); // Automatically add one if empty
    }

    badge.textContent = packages.length + ' package' + (packages.length !== 1 ? 's' : '');
    list.innerHTML = packages.map((pkg, i) => buildCard(pkg, i)).join('');
    attachTagListeners();
  }

  function esc(str) {
    return String(str ?? '').replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  }

  function buildCard(pkg, i) {
    const tags = Array.isArray(pkg.tags) ? pkg.tags : [];
    const tagChipsHtml = tags.map(t =>
      `<span class="tag-chip" data-tag="${esc(t)}">${esc(t)}<button type="button" onclick="removeTag(this)" title="Remove tag">×</button></span>`
    ).join('');

    return `<div class="card pkg-card" data-idx="${i}" id="pkg-${i}">
      <div class="card-header" onclick="toggleCard(${i})">
        <span class="pkg-name">${esc(pkg.name) || '<em style="color:var(--muted)">Untitled Package</em>'}</span>
        ${pkg.code ? `<span class="pkg-code">${esc(pkg.code)}</span>` : ''}
        <span class="chevron">▼</span>
      </div>
      <div class="card-body">
        <div class="form-grid">
          <div class="field">
            <label>Package Title *</label>
            <input type="text" data-field="name" value="${esc(pkg.name)}" placeholder="e.g. Dark Neon Theme" oninput="onFieldInput(${i},'name',this.value)">
          </div>
          <div class="field">
            <label>Store Code *</label>
            <input type="text" data-field="code" value="${esc(pkg.code)}" placeholder="e.g. DARK-NEON-01" oninput="onFieldInput(${i},'code',this.value)">
          </div>
          <div class="field full">
            <label>Description</label>
            <textarea data-field="description" placeholder="Short overview of the package..." oninput="onFieldInput(${i},'description',this.value)">${esc(pkg.description)}</textarea>
          </div>
          <div class="field">
            <label>Original Creator</label>
            <input type="text" data-field="creator" value="${esc(pkg.creator)}" placeholder="Author or team name" oninput="onFieldInput(${i},'creator',this.value)">
          </div>
          <div class="field">
            <label>Last Updated</label>
            <input type="datetime-local" data-field="updated" value="${esc(pkg.updated ? pkg.updated.replace('Z','') : '')}" oninput="onFieldInput(${i},'updated',this.value)">
          </div>
          <div class="field">
            <label>Platform *</label>
            <select data-field="platform" onchange="onFieldInput(${i},'platform',this.value)" style="background: var(--bg); border: 1px solid var(--border); border-radius: 8px; color: var(--text); font-family: inherit; font-size: .9rem; padding: .6rem .85rem; outline: none; width: 100%;">
              <option value="PS4" ${pkg.platform==='PS4'?'selected':''}>PlayStation 4</option>
              <option value="PS3" ${pkg.platform==='PS3'?'selected':''}>PlayStation 3</option>
              <option value="PS2" ${pkg.platform==='PS2'?'selected':''}>PlayStation 2</option>
              <option value="PS Vita" ${pkg.platform==='PS Vita'?'selected':''}>PS Vita</option>
              <option value="PSP" ${pkg.platform==='PSP'?'selected':''}>PSP / PlayStation Portable</option>
            </select>
          </div>
          <div class="field full">
            <label>Tags (press Enter or comma to add)</label>
            <div class="tags-input" id="tags-wrap-${i}" onclick="focusTagInput(${i})">
              ${tagChipsHtml}
              <input type="text" id="tag-input-${i}" placeholder="${tags.length ? '' : 'e.g. theme, retro, dark'}" style="border:none;background:transparent;outline:none;min-width:100px;flex:1;font-size:.85rem;color:var(--text)">
            </div>
          </div>
          <div class="field">
            <label>Icon Image (PNG, JPG, WEBP)</label>
            <div class="upload-zone" onclick="document.getElementById('icon-file-${i}').click()" ondragover="this.classList.add('dragover');event.preventDefault()" ondragleave="this.classList.remove('dragover')" ondrop="handleDrop(event, ${i}, 'icon')">
              <div class="preview-wrap" id="icon-preview-wrap-${i}">
                ${pkg.icon ? `<img src="${esc(pkg.icon)}" class="preview-thumb">` : `<svg viewBox="0 0 24 24"><path d="M19 3H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm0 16H5V5h14v14zm-5.04-6.71l-2.75 3.54-1.96-2.36L6.5 17h11l-3.54-4.71z"/></svg>`}
                <span class="file-name">${pkg.icon ? esc(pkg.icon.split('/').pop()) : 'Click or drop icon'}</span>
              </div>
              <input type="file" id="icon-file-${i}" accept="image/*" style="display:none" onchange="handleFileSelect(${i}, 'icon', this)">
              <input type="hidden" data-field="icon" value="${esc(pkg.icon)}">
            </div>
          </div>
          <div class="field">
            <label>Preview Image (PNG, JPG, WEBP)</label>
            <div class="upload-zone" onclick="document.getElementById('preview-file-${i}').click()" ondragover="this.classList.add('dragover');event.preventDefault()" ondragleave="this.classList.remove('dragover')" ondrop="handleDrop(event, ${i}, 'preview')">
              <div class="preview-wrap" id="preview-preview-wrap-${i}">
                ${pkg.preview ? `<img src="${esc(pkg.preview)}" class="preview-large">` : `<svg viewBox="0 0 24 24"><path d="M21 19V5c0-1.1-.9-2-2-2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2zM8.5 13.5l2.5 3.01L14.5 12l4.5 6H5l3.5-4.5z"/></svg>`}
                <span class="file-name">${pkg.preview ? esc(pkg.preview.split('/').pop()) : 'Click or drop preview image'}</span>
              </div>
              <input type="file" id="preview-file-${i}" accept="image/*" style="display:none" onchange="handleFileSelect(${i}, 'preview', this)">
              <input type="hidden" data-field="preview" value="${esc(pkg.preview)}">
            </div>
          </div>
          <div class="field">
            <label>ZIP Package</label>
            <div class="upload-zone" onclick="document.getElementById('zip-file-${i}').click()" ondragover="this.classList.add('dragover');event.preventDefault()" ondragleave="this.classList.remove('dragover')" ondrop="handleDrop(event, ${i}, 'zip_file')">
              <svg viewBox="0 0 24 24"><path d="M20 6h-8l-2-2H4c-1.1 0-1.99.9-1.99 2L2 18c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V8c0-1.1-.9-2-2-2zm0 12H4V8h16v10z"/></svg>
              <span class="file-name" id="zip-name-${i}">${pkg.zip_file ? esc(pkg.zip_file.split('/').pop()) : 'Click or drop ZIP file'}</span>
              <span class="upload-hint-box">Files should be moved to docs/uploads/</span>
              <input type="file" id="zip-file-${i}" accept=".zip,.rar,.7z" style="display:none" onchange="handleFileSelect(${i}, 'zip_file', this)">
              <input type="hidden" data-field="zip_file" value="${esc(pkg.zip_file)}">
            </div>
          </div>
          <div class="field">
            <label>External Download Redirect URL</label>
            <input type="text" data-field="download_url" value="${esc(pkg.download_url)}" placeholder="https://..." oninput="onFieldInput(${i},'download_url',this.value)">
            <span class="upload-hint-box">Optional. Use this to redirect downloads to an external file or source page instead of hosting the ZIP here.</span>
          </div>
        </div>
        <div class="card-actions">
          <button class="btn-danger" onclick="removePackage(${i})">🗑 Remove Package</button>
          <button class="btn-secondary" onclick="movePackage(${i},-1)" ${i===0?'disabled':''}>↑ Move Up</button>
          <button class="btn-secondary" onclick="movePackage(${i},1)" ${i===packages.length-1?'disabled':''}>↓ Move Down</button>
        </div>
      </div>
    </div>`;
  }

  // ── Tag logic ─────────────────────────────────────────────────────────────
  function attachTagListeners() {
    packages.forEach((_, i) => {
      const input = document.getElementById('tag-input-' + i);
      if (!input) return;
      input.addEventListener('keydown', e => {
        if (e.key === 'Enter' || e.key === ',') {
          e.preventDefault();
          const val = input.value.trim().replace(/,/g, '');
          if (val) addTag(i, val);
          input.value = '';
        } else if (e.key === 'Backspace' && !input.value) {
          const chips = document.querySelectorAll(`#tags-wrap-${i} .tag-chip`);
          if (chips.length) chips[chips.length - 1].querySelector('button').click();
        }
      });
    });
  }

  window.focusTagInput = function(i) {
    const el = document.getElementById('tag-input-' + i);
    if (el) el.focus();
  };

  window.addTag = function(i, val) {
    collectAll();
    if (!packages[i].tags) packages[i].tags = [];
    if (!packages[i].tags.includes(val)) {
      packages[i].tags.push(val);
      markDirty();
      render();
      const card = document.getElementById('pkg-' + i);
      if (card && !card.classList.contains('open')) card.classList.add('open');
    }
  };

  window.removeTag = function(btn) {
    collectAll();
    const chip = btn.closest('.tag-chip');
    const tag = chip.dataset.tag;
    const card = btn.closest('.pkg-card');
    const i = parseInt(card.dataset.idx, 10);
    packages[i].tags = (packages[i].tags || []).filter(t => t !== tag);
    markDirty();
    render();
    const newCard = document.getElementById('pkg-' + i);
    if (newCard) newCard.classList.add('open');
  };

  // ── Card interactions ─────────────────────────────────────────────────────
  window.toggleCard = function(i) {
    const card = document.getElementById('pkg-' + i);
    if (card) card.classList.toggle('open');
  };

  window.onFieldInput = function(i, field, value) {
    packages[i][field] = value;
    markDirty();
    // Update header live
    if (field === 'name' || field === 'code') {
      const card = document.getElementById('pkg-' + i);
      if (card) {
        const nameEl = card.querySelector('.pkg-name');
        const codeEl = card.querySelector('.pkg-code');
        if (nameEl) nameEl.innerHTML = esc(packages[i].name) || '<em style="color:var(--muted)">Untitled Package</em>';
        if (field === 'code') {
          if (value && codeEl) codeEl.textContent = value;
          else if (value && !codeEl) nameEl.insertAdjacentHTML('afterend', `<span class="pkg-code">${esc(value)}</span>`);
          else if (!value && codeEl) codeEl.remove();
        }
      }
    }
  };

  // ── Modern Upload Logic ──────────────────────────────────────────────────
  window.handleFileSelect = function(i, field, input) {
    const file = input.files[0];
    if (!file) return;
    processFile(i, field, file);
  };

  window.handleDrop = function(e, i, field) {
    e.preventDefault();
    e.currentTarget.classList.remove('dragover');
    const file = e.dataTransfer.files[0];
    if (!file) return;
    processFile(i, field, file);
  };

  function processFile(i, field, file) {
    const filename = file.name;
    const path = '/uploads/' + filename;
    
    // Update internal data
    packages[i][field] = path;
    markDirty();

    // Update hidden field
    const card = document.getElementById('pkg-' + i);
    const hidden = card.querySelector(`input[data-field="${field}"]`);
    if (hidden) hidden.value = path;

    // Visual feedback
    if (field === 'icon' || field === 'preview') {
      const wrap = document.getElementById(`${field}-preview-wrap-${i}`);
      const reader = new FileReader();
      reader.onload = e => {
        const imgClass = field === 'icon' ? 'preview-thumb' : 'preview-large';
        wrap.innerHTML = `<img src="${e.target.result}" class="${imgClass}"><span class="file-name">${esc(filename)}</span>`;
      };
      reader.readAsDataURL(file);
    } else if (field === 'zip_file') {
      const nameEl = document.getElementById(`zip-name-${i}`);
      if (nameEl) nameEl.textContent = filename;
    }

    toast(`Selected ${filename}. Remember to place it in docs/uploads/`);
  }

  window.addPackage = function(isUserAction = true) {
    if (isUserAction) collectAll();
    packages.push({ name: '', description: '', creator: '', code: '', tags: [], icon: '', preview: '', zip_file: '', download_url: '', platform: 'PS4', updated: '' });
    if (isUserAction) markDirty();
    render();
    const newIdx = packages.length - 1;
    const newCard = document.getElementById('pkg-' + newIdx);
    if (newCard) {
      newCard.classList.add('open');
      if (isUserAction) {
        newCard.scrollIntoView({ behavior: 'smooth', block: 'center' });
        const first = newCard.querySelector('input[data-field="name"]');
        if (first) setTimeout(() => first.focus(), 100);
      }
    }
  };

  window.removePackage = function(i) {
    if (!confirm(`Remove package "${packages[i].name || 'Untitled'}"?`)) return;
    collectAll();
    packages.splice(i, 1);
    markDirty();
    render();
    toast('Package removed. Click Save Package File to apply.', 'success');
  };

  window.movePackage = function(i, dir) {
    collectAll();
    const j = i + dir;
    if (j < 0 || j >= packages.length) return;
    [packages[i], packages[j]] = [packages[j], packages[i]];
    markDirty();
    render();
    const card = document.getElementById('pkg-' + j);
    if (card) card.classList.add('open');
  };

  // ── Load from file ────────────────────────────────────────────────────────
  window.loadFromFile = function() {
    const input = document.createElement('input');
    input.type = 'file';
    input.accept = '.json,application/json';
    input.onchange = () => {
      const file = input.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        try {
          const data = JSON.parse(e.target.result);
          packages = Array.isArray(data.dashboards) ? data.dashboards : [];
          dirty = false;
          document.getElementById('saveHint').textContent = `Loaded ${packages.length} package(s) from ${file.name} — click Save Package File when done.`;
          render();
          toast(`Loaded ${packages.length} package(s).`);
        } catch {
          toast('Invalid JSON file.', 'error');
        }
      };
      reader.readAsText(file);
    };
    input.click();
  };

  // ── Download JSON ─────────────────────────────────────────────────────────
  window.downloadJSON = function() {
    collectAll();
    const clean = packages.map(pkg => {
      const out = {};
      if (pkg.name) out.name = pkg.name;
      if (pkg.description) out.description = pkg.description;
      if (pkg.creator) out.creator = pkg.creator;
      if (pkg.code) out.code = pkg.code;
      out.tags = Array.isArray(pkg.tags) ? pkg.tags.filter(Boolean) : [];
      if (pkg.icon) out.icon = pkg.icon;
      if (pkg.preview) out.preview = pkg.preview;
      if (pkg.zip_file) out.zip_file = pkg.zip_file;
      if (pkg.download_url) out.download_url = pkg.download_url;
      if (pkg.updated) out.updated = pkg.updated.includes('T') && !pkg.updated.endsWith('Z') ? pkg.updated + 'Z' : pkg.updated;
      return out;
    });

    const json = JSON.stringify({ dashboards: clean }, null, 2);
    const blob = new Blob([json], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'themes.json';
    a.click();
    URL.revokeObjectURL(url);
    dirty = false;
    document.getElementById('saveHint').textContent = 'Package file ready! Replace docs/store/themes.json in the repo and push to publish.';
    toast('Upload file prepared — commit it to go live.');
  };

  // ── Auto-load live themes.json ─────────────────────────────────────────────
  fetch('../store/themes.json', { cache: 'no-store' })
    .then(r => r.ok ? r.json() : Promise.reject())
    .then(data => {
      packages = Array.isArray(data.dashboards) ? data.dashboards : [];
      document.getElementById('saveHint').textContent =
        `Loaded ${packages.length} package(s) from the live store. Edit below, then click Upload to Store.`;
      render();
    })
    .catch(() => {
      render();
      document.getElementById('saveHint').textContent = 'Could not auto-load existing packages. Click Import file… to load manually.';
    });

})();
</script>
</body>
</html>
